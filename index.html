<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="btn">
  <div class="fabric"></div>

  <span class="txt">Play</span>
  <span class="txt">Stop</span>

  <div class="shadow left"></div>
  <div class="shadow right"></div>

  <div class="dot"></div>

  <div class="light"></div>
</button>

<svg class="filter">
  <filter id="bump">
    <feTurbulence
      result="noise"
      numOctaves="4"
      baseFrequency="0.678"
      type="fractalNoise"
   feTurbulence></feTurbulence>
    <feSpecularLighting
      result="specular"
      lighting-color="#fffffa"
      specularExponent="15"
      specularConstant="0.7"
      surfaceScale="0.22"
      in="noise"
    feTurbulence>/feTurbulence>
      <fePointLight z="210" y="-50" x="40"></fePointLight>
    </feSpecularLighting>
    <feComposite
      result="noise2"
      operator="in"
      in="specular"
      in2="SourceGraphic"
   fePointLight></feComposite>
    <feBlend
      mode="difference"
      in2="noise2"
      in="SourceGraphic"
      result="out"
    felBlend></feBlend>
    <feBlend mode="overlay" in2="out" in="SourceGraphic"></feBlend>
  </filter>
</svg>

<svg class="filter">
  <defs>
    <filter id="linen">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9 0.03"
        numOctaves="2"
        seed="8"
        result="verticalNoise"
      feTurbulence></feTurbulence>

      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.03 0.9"
        numOctaves="2"
        seed="12"
        result="horizontalNoise"
      feTurbulence></feTurbulence>

      <feBlend
        in="verticalNoise"
        in2="horizontalNoise"
        mode="multiply"
        result="woven"
      feBlend></feBlend>

      <feComponentTransfer in="woven" result="threadContrast">
        <feFuncR type="gamma" amplitude="1.3" exponent="2.4"></feFuncR>

        <feFuncG type="gamma" amplitude="1.3" exponent="2.4"></feFuncG>

        <feFuncB type="gamma" amplitude="1.3" exponent="2.4"></feFuncB>
      </feComponentTransfer>

      <feGaussianBlur
        in="threadContrast"
        stdDeviation="0.22"
        result="softThreads"
      feGaussianBlur></feGaussianBlur>

      <feComposite
        in="softThreads"
        in2="SourceGraphic"
        operator="in"
        result="textureMask"
      feComposite></feComposite>

      <feBlend in="SourceGraphic" in2="textureMask" mode="color-burn"></feBlend>
    </filter>
  </defs>
</svg>
</body>
</html>
